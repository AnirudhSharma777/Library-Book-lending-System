# Settings for tests marked with @ActiveProfiles("test").
# Anything set here overrides src/main/resources/application.yml.

spring:
  datasource:
    # Throwaway in-memory database, created fresh for each test run.
    # MODE=PostgreSQL makes H2 behave more like the real database.
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop   # build the tables from the entities, drop them at the end
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect   # replaces the PostgreSQL dialect from application.yml

security:
  jwt:
    # Test-only secret (Base64 of "test-secret-key-for-unit-tests-1234"). Never the real one.
    secret: dGVzdC1zZWNyZXQta2V5LWZvci11bml0LXRlc3RzLTEyMzQ=
    expiration: 3600000

cloudinary:
  # Dummy values so the Cloudinary bean can be created. Tests mock FileUpload, so nothing is uploaded.
  cloud_name: test
  api_key: test
  api_secret: test
